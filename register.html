
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SafeServe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <div class="auth-container">

        <a href="index.html" class="auth-logo">🛡️ SafeServe</a>

        <div class="auth-card">

            <h1>Create Account</h1>
            <p class="auth-subtitle">
                Register your canteen and manage its food safety operations.
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="businessName">Canteen / Business Name</label>
                    <input
                        type="text"
                        id="businessName"
                        placeholder="e.g.  Campus Canteen"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="ownerName">Owner Name</label>
                    <input
                        type="text"
                        id="ownerName"
                        placeholder="Enter owner's full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="contact">Contact Number (Optional)</label>
                    <input
                        type="tel"
                        id="contact"
                        placeholder="Enter contact number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >
                </div>

                <p id="registerMessage" class="auth-message"></p>

                <button type="submit" class="auth-submit">
                    Create Canteen Account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html" class="back-home">← Back to Home</a>

        </div>
    </div>
<script type="module" src="auth.js"></script>
</body>
</html>
